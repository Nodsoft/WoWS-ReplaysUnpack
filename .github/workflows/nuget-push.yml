name: Publish NuGet packages

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

# Controls when the action will run. 
on:
  push:
    branches: 
    - master
    - develop

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
jobs:
  build-test:
    uses: ./.github/workflows/build.yml

  publish-nuget:
    name: Publish NuGet package
    runs-on: ubuntu-latest
    needs: 
      - build-test

    strategy:
      fail-fast: false
      matrix:
        # Projects to publish
        project: [ 
          { name: "Main", path: "Nodsoft.WowsReplaysUnpack/Nodsoft.WowsReplaysUnpack.csproj" },
          { name: "Core", path: "Nodsoft.WowsReplaysUnpack.Core/Nodsoft.WowsReplaysUnpack.Core.csproj" },
          { name: "ExtendedData", path: "Nodsoft.WowsReplaysUnpack.ExtendedData/Nodsoft.WowsReplaysUnpack.ExtendedData.csproj" },
          { name: "Generators", path: "Nodsoft.WowsReplaysUnpack.Generators/Nodsoft.WowsReplaysUnpack.Generators.csproj" }
        ]
        
        # Sources to publish to
        nuget: [ 
          { name: "NuGet", source: "https://api.nuget.org", keyname: "NUGET_TOKEN" }, 
          { name: "GitHub Packages", source: "https://nuget.pkg.github.com/Nodsoft", keyname: "GITHUB_TOKEN" } 
        ]
        
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # avoid shallow clone so nbgv can do its work.

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: dotnet/nbgv@v0.5.2
        id: nbgv

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Package
        run: dotnet pack -c Release --no-build --include-symbols


      - id: is-public-release
        uses: ASzc/change-string-case-action@v8
        with:
          string: ${{ steps.nbgv.outputs.PublicRelease }}

      - name: Attest build provenance for .(s)nupkgs
        uses: actions/attest-build-provenance@v4
        # Only once per package: take nuget provider
        if: matrix.nuget.name == 'NuGet'
        with:
          subject-path: "**/Release/*nupkg"

      # Publish
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1.2.0
        if: matrix.nuget.name == 'NuGet'
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}


      - name: Publish packages to ${{ matrix.nuget.name }}
        run: |
          dotnet nuget push "**/Release/*.nupkg" \
          --source "${{ matrix.nuget.source }}" \
          --symbol-source "${{ matrix.nuget.source }}" \
          --api-key "${{ matrix.nuget.name == 'NuGet' && steps.nuget_login.outputs.NUGET_API_KEY || secrets[matrix.nuget.keyname] }}" \
          --symbol-api-key "${{ matrix.nuget.name == 'NuGet' && steps.nuget_login.outputs.NUGET_API_KEY || secrets[matrix.nuget.keyname] }}" \
          --skip-duplicate